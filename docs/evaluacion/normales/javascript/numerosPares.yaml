nombre: numerosPares
lenguaje: javascript
framework_default: vitest

atributos:
  - retorno_coleccion

codigo: |
  function numerosPares(numeros) {
    return numeros.filter((n) => n % 2 === 0);
  }

casos:
  - tipo: camino_feliz
    descripcion: filtra los pares de un arreglo mixto
    entrada: "numerosPares([1, 2, 3, 4, 5, 6])"
    esperado: "[2, 4, 6]"
  - tipo: valor_limite
    descripcion: arreglo vacío retorna arreglo vacío
    entrada: "numerosPares([])"
    esperado: "[]"
  - tipo: entrada_invalida
    descripcion: la entrada no es un arreglo
    entrada: "numerosPares(null)"
    esperado: "TypeError"
