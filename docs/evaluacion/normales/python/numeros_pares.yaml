nombre: numeros_pares
lenguaje: python
framework_default: pytest

atributos:
  - retorno_coleccion

codigo: |
  def numeros_pares(numeros):
      return [n for n in numeros if n % 2 == 0]

casos:
  - tipo: camino_feliz
    descripcion: filtra los pares de una lista mixta
    entrada: "numeros_pares([1, 2, 3, 4, 5, 6])"
    esperado: "[2, 4, 6]"
  - tipo: valor_limite
    descripcion: lista vacía retorna lista vacía
    entrada: "numeros_pares([])"
    esperado: "[]"
  - tipo: entrada_invalida
    descripcion: elemento no numérico rompe el operador módulo
    entrada: "numeros_pares([1, 'a', 3])"
    esperado: "TypeError"
