<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    :root {
      --bg: oklch(18% 0.02 260);
      --surface: oklch(23% 0.02 260);
      --line: oklch(34% 0.02 260);
      --ink: oklch(95% 0.008 260);
      --muted: oklch(66% 0.02 260);
      --accent: oklch(78% 0.19 155);
      --accent-ink: oklch(16% 0.03 155);
      --warn: oklch(72% 0.17 45);
    }
    .root { width:100%; min-height:100%; background:var(--bg); color:var(--ink); font-family:'Sora','Segoe UI',sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
    .mono { font-family:'IBM Plex Mono','Courier New',monospace; }
    .btn { font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:14px; padding:14px 26px; border-radius:6px; cursor:pointer; border:1px solid transparent; }
  </style>
</helmet>

<div class="root">

  <div style="padding:80px 40px 50px;">
    <div class="mono" style="display:inline-block; font-size:12px; font-weight:500; color:var(--warn); border:1px solid var(--warn); border-radius:999px; padding:6px 14px; margin-bottom:24px;">● LÍMITE ALCANZADO</div>
    <h1 style="font-size:44px; font-weight:800; line-height:1.1; letter-spacing:-0.01em; margin:0 0 18px; max-width:640px;">Se acabaron tus pruebas por hoy</h1>
    <p style="font-size:16px; line-height:1.6; color:var(--muted); max-width:480px; margin:0 auto 40px;">
      Sin cuenta, Testly da 3 generaciones al día por IP — y ya usaste las tuyas. Crea una sesión gratis para más cuota e historial.
    </p>

    <div style="display:flex; justify-content:center; gap:14px; margin-bottom:14px;">
      <div style="background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:16px 22px; min-width:84px;">
        <div class="mono" style="font-size:30px; font-weight:600; color:var(--accent);">14</div>
        <div class="mono" style="font-size:10px; color:var(--muted); letter-spacing:.1em; margin-top:4px;">HORAS</div>
      </div>
      <div style="background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:16px 22px; min-width:84px;">
        <div class="mono" style="font-size:30px; font-weight:600; color:var(--accent);">32</div>
        <div class="mono" style="font-size:10px; color:var(--muted); letter-spacing:.1em; margin-top:4px;">MIN</div>
      </div>
      <div style="background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:16px 22px; min-width:84px;">
        <div class="mono" style="font-size:30px; font-weight:600; color:var(--accent);">08</div>
        <div class="mono" style="font-size:10px; color:var(--muted); letter-spacing:.1em; margin-top:4px;">SEG</div>
      </div>
    </div>
    <div class="mono" style="font-size:11px; color:var(--muted); letter-spacing:.08em; margin-bottom:36px;">VUELVE A INTENTARLO EN</div>

    <div style="display:flex; justify-content:center; gap:14px; flex-wrap:wrap;">
      <button class="btn" style="background:var(--accent); color:var(--accent-ink);">Crear sesión gratis</button>
      <button class="btn" style="background:transparent; color:var(--ink); border-color:var(--line);">Volver mañana</button>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
